[client]
# Never show raw stack traces to users (CLAUDE.md section 10).
showErrorDetails = false
# Hide the Deploy button and developer menu items from visitors.
toolbarMode = "minimal"

[server]
headless = true
# Largest Bulk Check upload in MB (CSV or Parquet). The API limit is
# LOANLENS_JOB_MAX_UPLOAD_MB (default 200 as well).
maxUploadSize = 200

[browser]
gatherUsageStats = false

# Light fintech theme. Colours mirror src/loanlens/theme.py (STREAMLIT_THEME); a test keeps
# the two in sync. base = "light" forces the same look on every machine. Streamlit 1.40 only
# offers "sans serif" here; the Inter font, radii and shadows come from the theme CSS.
[theme]
base = "light"
primaryColor = "#2E74E9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FE"
textColor = "#0F1B3D"
font = "sans serif"
