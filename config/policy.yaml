# LoanLens policy configuration.
# Single source of truth for every threshold used by the decision logic.
# All values below are PLACEHOLDERS: illustrative values only. A lender would
# replace them with its own credit policy. Do not treat them as real lending policy.

rules:
  min_cibil: 550              # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy
  max_emi_to_income: 0.50     # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy (monthly EMI / monthly income)
  max_loan_to_income: 4.0     # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy (loan amount / annual income)
  max_loan_to_assets: 1.5     # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy (loan amount / total assets)
  min_loan_term_years: 2      # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy
  max_loan_term_years: 20     # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy

emi:
  assumed_annual_interest_rate: 0.10  # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy (dataset has no rate)

model:
  approval_threshold: 0.5     # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy
  borderline_band:
    lower: 0.4                # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy
    upper: 0.6                # PLACEHOLDER - illustrative value; a lender would replace it with its own credit policy

cleaning:
  # How to treat negative residential_assets_value (data errors).
  # Options: "clip_zero" (set to 0), "drop" (remove rows), "nan" (set to missing).
  negative_assets_strategy: clip_zero
