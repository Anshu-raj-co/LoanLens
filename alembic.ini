# Alembic configuration for LoanLens. Run from the project root, for example:
#   alembic upgrade head
# The database comes from the DATABASE_URL environment variable (never written here);
# without it the local SQLite file data/loanlens.sqlite is used.

[alembic]
script_location = src/loanlens/db/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
